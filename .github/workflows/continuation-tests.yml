name: Integral topology and conditioned continuation
on:
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', 'workflows/**', 'environment/continuation-requirements.txt', '.github/workflows/continuation-tests.yml']
  pull_request:
    paths: ['src/**', 'tests/**', 'workflows/**', 'environment/continuation-requirements.txt', '.github/workflows/continuation-tests.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  continuation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            src
            tests
            workflows
            environment
            configs/methods
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install -r environment/continuation-requirements.txt
      - name: Run scoped suite; no C++ or physics-reproduction claim
        run: python workflows/test_continuation.py --junitxml results/continuation-tests.xml
      - name: Run and verify small synthetic end-to-end study
        run: |
          python workflows/run_continuation_study.py --quick
          python workflows/run_continuation_study.py --quick
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: continuation-evidence
          path: |
            results/continuation-tests.xml
            results/continuation
          if-no-files-found: warn
          retention-days: 14
